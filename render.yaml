databases:
  - name: dify-db
    plan: basic-256mb
    region: oregon
    postgresMajorVersion: "16"
    ipAllowList: []

services:
  - type: keyvalue
    name: dify-redis
    plan: free
    region: oregon
    maxmemoryPolicy: allkeys-lru
    persistenceMode: off
    ipAllowList: []

  - type: web
    name: dify-api
    runtime: image
    plan: starter
    region: oregon
    image:
      url: docker.io/langgenius/dify-api:1.16.0
    healthCheckPath: /health
    envVars:
      - key: MODE
        value: api
      - key: EDITION
        value: SELF_HOSTED
      - key: DEPLOY_ENV
        value: PRODUCTION
      - key: SECRET_KEY
        generateValue: true
      - key: INIT_PASSWORD
        sync: false
      - key: DB_TYPE
        value: postgresql
      - key: DB_USERNAME
        fromDatabase:
          name: dify-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: dify-db
          property: password
      - key: DB_HOST
        fromDatabase:
          name: dify-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: dify-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: dify-db
          property: database
      - key: REDIS_HOST
        fromService:
          type: keyvalue
          name: dify-redis
          property: host
      - key: REDIS_PORT
        fromService:
          type: keyvalue
          name: dify-redis
          property: port
      - key: REDIS_PASSWORD
        value: ""
      - key: CELERY_BROKER_URL
        fromService:
          type: keyvalue
          name: dify-redis
          property: connectionString
      - key: STORAGE_TYPE
        value: opendal
      - key: OPENDAL_SCHEME
        value: fs
      - key: OPENDAL_FS_ROOT
        value: /app/api/storage
      - key: VECTOR_STORE
        value: weaviate
      - key: WEAVIATE_ENDPOINT
        value: http://dify-weaviate:8080
      - key: WEAVIATE_API_KEY
        value: WVF5YThaHlkYwhGUSmCRgsX3tD5ngdN8pkih
      - key: CHECK_UPDATE_URL
        value: ""
      - key: LOG_LEVEL
        value: INFO
      - key: FLASK_APP
        value: app.py
      - key: SERVER_WORKER_AMOUNT
        value: "2"
      - key: GUNICORN_TIMEOUT
        value: "360"
      - key: MIGRATION_ENABLED
        value: "true"
      - key: CODE_EXECUTION_ENABLED
        value: "false"

  - type: worker
    name: dify-worker
    runtime: image
    plan: starter
    region: oregon
    image:
      url: docker.io/langgenius/dify-api:1.16.0
    envVars:
      - key: MODE
        value: worker
      - key: EDITION
        value: SELF_HOSTED
      - key: DEPLOY_ENV
        value: PRODUCTION
      - key: SECRET_KEY
        generateValue: true
      - key: DB_TYPE
        value: postgresql
      - key: DB_USERNAME
        fromDatabase:
          name: dify-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: dify-db
          property: password
      - key: DB_HOST
        fromDatabase:
          name: dify-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: dify-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: dify-db
          property: database
      - key: REDIS_HOST
        fromService:
          type: keyvalue
          name: dify-redis
          property: host
      - key: REDIS_PORT
        fromService:
          type: keyvalue
          name: dify-redis
          property: port
      - key: REDIS_PASSWORD
        value: ""
      - key: CELERY_BROKER_URL
        fromService:
          type: keyvalue
          name: dify-redis
          property: connectionString
      - key: STORAGE_TYPE
        value: opendal
      - key: OPENDAL_SCHEME
        value: fs
      - key: OPENDAL_FS_ROOT
        value: /app/api/storage
      - key: VECTOR_STORE
        value: weaviate
      - key: WEAVIATE_ENDPOINT
        value: http://dify-weaviate:8080
      - key: WEAVIATE_API_KEY
        value: WVF5YThaHlkYwhGUSmCRgsX3tD5ngdN8pkih
      - key: CHECK_UPDATE_URL
        value: ""
      - key: LOG_LEVEL
        value: INFO
      - key: CELERY_WORKER_AMOUNT
        value: "2"

  - type: web
    name: dify-web
    runtime: image
    plan: starter
    region: oregon
    image:
      url: docker.io/langgenius/dify-web:1.16.0
    healthCheckPath: /
    envVars:
      - key: EDITION
        value: SELF_HOSTED
      - key: CONSOLE_API_URL
        value: ""
      - key: SERVER_CONSOLE_API_URL
        fromService:
          type: web
          name: dify-api
          property: hostport
      - key: APP_API_URL
        value: ""
      - key: NEXT_PUBLIC_SOCKET_URL
        fromService:
          type: web
          name: dify-api
          property: hostport
      - key: NEXT_PUBLIC_API_PREFIX
        value: ""
      - key: NEXT_PUBLIC_PUBLIC_API_PREFIX
        value: ""
      - key: DEPLOY_ENV
        value: PRODUCTION
      - key: TEXT_GENERATION_TIMEOUT_MS
        value: "60000"
      - key: CSP_WHITELIST
        value: ""
      - key: MARKETPLACE_API_URL
        value: https://marketplace.dify.ai
      - key: MARKETPLACE_URL
        value: https://marketplace.dify.ai
      - key: ENABLE_WEBSITE_JINAREADER
        value: "true"

  - type: web
    name: dify-weaviate
    runtime: image
    plan: starter
    region: oregon
    image:
      url: docker.io/semitechnologies/weaviate:1.27.0
    healthCheckPath: /health
    envVars:
      - key: PERSISTENCE_DATA_PATH
        value: /var/lib/weaviate
      - key: AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED
        value: "true"
      - key: DEFAULT_VECTORIZER_MODULE
        value: none
      - key: CLUSTER_HOSTNAME
        value: node1
      - key: DISABLE_TELEMETRY
        value: "true"
